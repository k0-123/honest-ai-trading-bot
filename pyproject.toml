[project]
name = "nsebot"
version = "0.1.0"
description = "Honest paper-trading bot for NSE: rule-based baseline vs TradingAgents LLM, with Indian costs."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "pyyaml>=6", "pydantic>=2.6",
  "yfinance>=0.2.50", "matplotlib>=3.8", "jugaad-data>=0.27",
]

[project.optional-dependencies]
llm = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nsebot = "nsebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
