# All money in INR unless stated. Every number here is configurable.
symbols: [RELIANCE.NS, TCS.NS, HDFCBANK.NS, INFY.NS, ICICIBANK.NS]
benchmark: NIFTYBEES.NS
capital: 100000
data:
  start: "2015-01-01"
  cache_dir: cache/prices
costs:                      # NSE equity delivery (CNC), based on Zerodha's charges. Update when you pick a broker.
  brokerage_pct: 0.0        # e.g. 0.0003 for 0.03%
  brokerage_cap: 20.0       # max per order, INR
  stt_pct: 0.001            # 0.1% on buy and sell (delivery)
  exchange_txn_pct: 0.0000297
  sebi_fee_pct: 0.000001    # Rs 10 per crore
  gst_pct: 0.18             # on brokerage + exchange + SEBI
  stamp_duty_buy_pct: 0.00015
  dp_charge_per_sell: 15.93 # per scrip per sell day
  slippage_pct: 0.0005      # 0.05% each side (0.05%-0.10% recommended)
risk:
  risk_per_trade_pct: 0.01
  max_position_pct: 0.20
  daily_loss_limit_pct: 0.02
  max_drawdown_pct: 0.10
  atr_stop_mult: 2.0
baseline:
  sma_fast: 50
  sma_slow: 200
  rsi_period: 14
  rsi_entry: 35
  rsi_exit: 70
  atr_period: 14
  exit_below_fast_days: 0   # 0 = off (see README "Strategy changes")
llm:
  enabled: true
  provider: google
  model: gemini-2.5-flash   # cheap/fast; change here only
  api_key_env: GOOGLE_API_KEY
  max_debate_rounds: 1
  cache_dir: cache/llm
  budget_usd_total: 5.0     # hard cap for the historical sample
  budget_usd_per_day: 0.50  # cap for forward daily runs
  usd_inr: 84.0
  est_cost_per_call_usd: 0.05  # charged per call if token usage can't be read (keeps budget enforced)
  price_per_mtok_usd: {input: 0.30, output: 2.50}
backtest:
  splits: {train_end: "2020-12-31", val_end: "2022-12-31"}   # test = after val_end
# NSE trading holidays: the paper runner never treats these as sessions (Yahoo sometimes shows phantom bars on
# holidays), and v2b uses them in paper mode to find the last session of a month.
nse_holidays:   # NSE official equity trading holidays (weekdays). Source: data/nse_holidays/. Add 2027 when NSE publishes it (usually December).
  - "2026-01-15"   # Municipal Corporation Election - Maharashtra
  - "2026-01-26"   # Republic Day
  - "2026-03-03"   # Holi
  - "2026-03-26"   # Shri Ram Navami
  - "2026-03-31"   # Shri Mahavir Jayanti
  - "2026-04-03"   # Good Friday
  - "2026-04-14"   # Dr. Baba Saheb Ambedkar Jayanti
  - "2026-05-01"   # Maharashtra Day
  - "2026-05-28"   # Bakri Id
  - "2026-06-26"   # Muharram
  - "2026-09-14"   # Ganesh Chaturthi
  - "2026-10-02"   # Mahatma Gandhi Jayanti
  - "2026-10-20"   # Dussehra
  - "2026-11-10"   # Diwali-Balipratipada
  - "2026-11-24"   # Prakash Gurpurb Sri Guru Nanak Dev
  - "2026-12-25"   # Christmas
# Forward paper trading kill-switch per book (set before forward trading started; see README section 6d).
# v1 ("baseline") keeps risk.max_drawdown_pct = 10%. Backtests always use 10%.
paper_max_drawdown:
  v2a_parking: 0.15
  v2b_momentum: 0.15
paths:
  state_dir: state
  reports_dir: reports_out
